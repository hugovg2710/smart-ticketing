services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    # Instala dependencias si faltan y arranca Apache
    command: sh -c "[ -f vendor/autoload.php ] || composer install --no-interaction --prefer-dist; apache2-foreground"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    # El puerto de MySQL solo se expone en localhost (útil para un cliente SQL local)
    ports:
      - "127.0.0.1:${DB_EXPOSED_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: ${DB_NAME:-app_db}
      MYSQL_USER: ${DB_USER:?Define DB_USER en .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db_data:/var/lib/mysql
      - ./src/init.sql:/docker-entrypoint-initdb.d/01-init.sql

volumes:
  db_data:
